name: Testitem CI workflow

on:
  workflow_call:
    inputs:
      include-release-versions:
        type: boolean
        required: false
        default: true
      include-lts-versions:
        type: boolean
        required: false
        default: true
      include-all-compatible-minor-versions:
        type: boolean
        required: false
        default: false
      include-smallest-compatible-minor-versions:
        type: boolean
        required: false
        default: true
      include-rc-versions:
        type: boolean
        required: false
        default: true
      include-beta-versions:
        type: boolean
        required: false
        default: false
      include-alpha-versions:
        type: boolean
        required: false
        default: false
      include-nightly-versions:
        type: boolean
        required: false
        default: false
      include-windows-x64:
        type: boolean
        required: false
        default: true
      include-windows-x86:
        type: boolean
        required: false
        default: true
      include-linux-x64:
        type: boolean
        required: false
        default: true
      include-linux-x86:
        type: boolean
        required: false
        default: true
      include-macos-x64:
        type: boolean
        required: false
        default: true
      include-macos-aarch64:
        type: boolean
        required: false
        default: true
      allow-failure:
        type: string
        required: false
        # Globs matched against "<juliaup-channel>:<os>"; see julia-compute-test-matrix.
        # Legs that match may fail without failing the run. "none" makes every leg blocking.
        default: "rc,beta,alpha,nightly"
      env:
        type: string
        required: false
        default: ""
      filter:
        type: string
        required: false
        default: ""
      github_job_prep_script:
        type: string
        required: false
        default: ""
      testitem-timeout:
        type: string
        required: false
        default: ""
      # Execution settings forwarded to julia-run-testitems. Deliberately not given the
      # per-trigger override treatment below: those exist for varying how much gets tested
      # on a draft PR versus main, whereas these describe how the test processes behave and
      # do not sensibly differ by trigger.
      junit-path:
        type: string
        required: false
        default: ""
      coverage:
        type: boolean
        required: false
        default: true
      coverage-lcov-path:
        type: string
        required: false
        default: ""
      output-mode:
        type: string
        required: false
        default: ""
      max-workers:
        type: string
        required: false
        default: ""
      threads:
        type: string
        required: false
        default: ""
      gc-between-testitems:
        type: string
        required: false
        default: ""
      memory-threshold:
        type: string
        required: false
        default: ""
      schedule:
        type: string
        required: false
        default: ""
      test-log-level:
        type: string
        required: false
        default: ""
      activation-timeout:
        type: string
        required: false
        default: ""
      # Opt-in: error the run's remaining items after this many seconds with no test
      # process busy and no message about it. Empty (the default) never fails an idle run —
      # it is only warned about in the log. Activating, revising and running a test item
      # all count as progress, so this bounds a run whose workers died without reporting
      # it, not a slow one. Worth setting where a hung run would otherwise burn the whole
      # job timeout.
      run-stall:
        type: string
        required: false
        default: ""
      # 'auto' rather than the action's historical 'yes': forcing bounds checks recompiles
      # the whole dependency tree into a separate cache on every leg, which is most of what
      # made these runs slow. Set 'yes' to get Pkg.test's semantics back.
      check-bounds:
        type: string
        required: false
        default: "auto"
      # Overrides for draft PR runs
      draft-pr-include-release-versions:
        type: string
        required: false
        default: ""
      draft-pr-include-lts-versions:
        type: string
        required: false
        default: ""
      draft-pr-include-all-compatible-minor-versions:
        type: string
        required: false
        default: ""
      draft-pr-include-smallest-compatible-minor-versions:
        type: string
        required: false
        default: ""
      draft-pr-include-rc-versions:
        type: string
        required: false
        default: ""
      draft-pr-include-beta-versions:
        type: string
        required: false
        default: ""
      draft-pr-include-alpha-versions:
        type: string
        required: false
        default: ""
      draft-pr-include-nightly-versions:
        type: string
        required: false
        default: ""
      draft-pr-include-windows-x64:
        type: string
        required: false
        default: ""
      draft-pr-include-windows-x86:
        type: string
        required: false
        default: ""
      draft-pr-include-linux-x64:
        type: string
        required: false
        default: ""
      draft-pr-include-linux-x86:
        type: string
        required: false
        default: ""
      draft-pr-include-macos-x64:
        type: string
        required: false
        default: ""
      draft-pr-include-macos-aarch64:
        type: string
        required: false
        default: ""
      draft-pr-allow-failure:
        type: string
        required: false
        default: ""
      draft-pr-env:
        type: string
        required: false
        default: ""
      draft-pr-filter:
        type: string
        required: false
        default: ""
      draft-pr-github_job_prep_script:
        type: string
        required: false
        default: ""
      draft-pr-testitem-timeout:
        type: string
        required: false
        default: ""
      # Overrides for non-draft PR runs
      pr-include-release-versions:
        type: string
        required: false
        default: ""
      pr-include-lts-versions:
        type: string
        required: false
        default: ""
      pr-include-all-compatible-minor-versions:
        type: string
        required: false
        default: ""
      pr-include-smallest-compatible-minor-versions:
        type: string
        required: false
        default: ""
      pr-include-rc-versions:
        type: string
        required: false
        default: ""
      pr-include-beta-versions:
        type: string
        required: false
        default: ""
      pr-include-alpha-versions:
        type: string
        required: false
        default: ""
      pr-include-nightly-versions:
        type: string
        required: false
        default: ""
      pr-include-windows-x64:
        type: string
        required: false
        default: ""
      pr-include-windows-x86:
        type: string
        required: false
        default: ""
      pr-include-linux-x64:
        type: string
        required: false
        default: ""
      pr-include-linux-x86:
        type: string
        required: false
        default: ""
      pr-include-macos-x64:
        type: string
        required: false
        default: ""
      pr-include-macos-aarch64:
