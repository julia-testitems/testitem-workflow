name: Testitem CI workflow

on:
  workflow_call:
    inputs:
      include-release-versions:
        type: boolean
        required: false
        default: true
      include-lts-versions:
        type: boolean
        required: false
        default: true
      include-all-compatible-minor-versions:
        type: boolean
        required: false
        default: false
      include-smallest-compatible-minor-versions:
        type: boolean
        required: false
        default: true
      include-rc-versions:
        type: boolean
        required: false
        default: true
      include-beta-versions:
        type: boolean
        required: false
        default: false
      include-alpha-versions:
        type: boolean
        required: false
        default: false
      include-nightly-versions:
        type: boolean
        required: false
        default: false
      include-windows-x64:
        type: boolean
        required: false
        default: true
      include-windows-x86:
        type: boolean
        required: false
        default: true
      include-linux-x64:
        type: boolean
        required: false
        default: true
      include-linux-x86:
        type: boolean
        required: false
        default: true
      include-macos-x64:
        type: boolean
        required: false
        default: true
      include-macos-aarch64:
        type: boolean
        required: false
        default: true
      allow-failure:
        type: string
        required: false
        # Globs matched against "<juliaup-channel>:<os>"; see julia-compute-test-matrix.
        # Legs that match may fail without failing the run. "none" makes every leg blocking.
        default: "rc,beta,alpha,nightly"
      env:
        type: string
        required: false
        default: ""
      filter:
        type: string
        required: false
        default: ""
      github_job_prep_script:
        type: string
        required: false
        default: ""
      testitem-timeout:
        type: number
        required: false
        default: 1200
      # Execution settings forwarded to julia-run-testitems. Deliberately not given the
      # per-trigger override treatment below: those exist for varying how much gets tested
      # on a draft PR versus main, whereas these describe how the test processes behave and
      # do not sensibly differ by trigger.
      junit-path:
        type: string
        required: false
        default: ""
      coverage:
        type: boolean
        required: false
        default: true
      coverage-lcov-path:
        type: string
        required: false
        default: ""
      output-mode:
        type: string
        required: false
        default: ""
      max-workers:
        type: string
        required: false
        default: ""
      threads:
        type: string
        required: false
        default: ""
      gc-between-testitems:
        type: string
        required: false
        default: ""
      memory-threshold:
        type: string
        required: false
        default: ""
      schedule:
        type: string
        required: false
        default: ""
      # Overrides for draft PR runs
      draft-pr-include-release-versions:
        type: string
        required: false
        default: ""
      draft-pr-include-lts-versions:
        type: string
        required: false
        default: ""
      draft-pr-include-all-compatible-minor-versions:
        type: string
        required: false
        default: ""
      draft-pr-include-smallest-compatible-minor-versions:
        type: string
        required: false
        default: ""
      draft-pr-include-rc-versions:
        type: string
        required: false
        default: ""
      draft-pr-include-beta-versions:
        type: string
        required: false
        default: ""
      draft-pr-include-alpha-versions:
        type: string
        required: false
        default: ""
      draft-pr-include-nightly-versions:
        type: string
        required: false
        default: ""
      draft-pr-include-windows-x64:
        type: string
        required: false
        default: ""
      draft-pr-include-windows-x86:
        type: string
        required: false
        default: ""
      draft-pr-include-linux-x64:
        type: string
        required: false
        default: ""
      draft-pr-include-linux-x86:
        type: string
        required: false
        default: ""
      draft-pr-include-macos-x64:
        type: string
        required: false
        default: ""
      draft-pr-include-macos-aarch64:
        type: string
        required: false
        default: ""
