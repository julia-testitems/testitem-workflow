permissions: write-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  lint:
    if: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') || (github.event_name == 'workflow_dispatch' && github.event.inputs.feature == 'LintAndTest') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/julia-lint@v2
        id: lint-step
      - uses: actions/upload-artifact@v7
        # The lint step fails the job on lint errors, but the SARIF is still
        # needed by the report job.
        if: ${{ !cancelled() }}
        with:
          name: lintresults
          path: lint-results.sarif
          retention-days: 1
          # A tool failure (exit code 2) produces no SARIF file.
          if-no-files-found: ignore

  # Check-only formatting gate (the canonical CI mode: fail with a diff, fix
  # locally). Runs whenever lint/tests run; a repo opts in by having a
  # JuliaFormat.toml anywhere in its tree — without one, every step no-ops.
  format:
    if: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') || (github.event_name == 'workflow_dispatch' && github.event.inputs.feature == 'LintAndTest') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-vscode/julia-format@v1
        with:
          # Opt-in gate: without a JuliaFormat.toml the action no-ops.
          require-config: true

  compute-test-matrix:
    if: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') || (github.event_name == 'workflow_dispatch' && github.event.inputs.feature == 'LintAndTest') }}
    runs-on: ubuntu-latest
    outputs:
      test-matrix: ${{ steps.compute-test-matrix.outputs.test-matrix }}
      env: ${{ steps.resolve.outputs.env }}
      filter: ${{ steps.resolve.outputs.filter }}
      github_job_prep_script: ${{ steps.resolve.outputs.github_job_prep_script }}
      testitem-timeout: ${{ steps.resolve.outputs.testitem-timeout }}
    steps:
      - id: resolve
        shell: bash
        env:
          INPUTS_JSON: ${{ toJson(inputs) }}
          IS_DRAFT_PR: ${{ github.event.pull_request.draft }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$IS_DRAFT_PR" == "true" ]]; then
            prefix="draft-pr-"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            prefix="pr-"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            prefix="main-"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            prefix="manual-trigger-"
          else
            prefix=""
          fi

          resolve() {
            local key="$1"
            local override
            override=$(echo "$INPUTS_JSON" | jq -r --arg k "${prefix}${key}" '.[$k] // ""')
            if [[ -n "$override" ]]; then
              echo "$override"
            else
              echo "$INPUTS_JSON" | jq -r --arg k "$key" '.[$k] | tostring'
            fi
          }

          echo "include-release-versions=$(resolve include-release-versions)" >> "$GITHUB_OUTPUT"
          echo "include-lts-versions=$(resolve include-lts-versions)" >> "$GITHUB_OUTPUT"
          echo "include-all-compatible-minor-versions=$(resolve include-all-compatible-minor-versions)" >> "$GITHUB_OUTPUT"
          echo "include-smallest-compatible-minor-versions=$(resolve include-smallest-compatible-minor-versions)" >> "$GITHUB_OUTPUT"
          echo "include-rc-versions=$(resolve include-rc-versions)" >> "$GITHUB_OUTPUT"
          echo "include-beta-versions=$(resolve include-beta-versions)" >> "$GITHUB_OUTPUT"
          echo "include-alpha-versions=$(resolve include-alpha-versions)" >> "$GITHUB_OUTPUT"
          echo "include-nightly-versions=$(resolve include-nightly-versions)" >> "$GITHUB_OUTPUT"
          echo "include-windows-x64=$(resolve include-windows-x64)" >> "$GITHUB_OUTPUT"
          echo "include-windows-x86=$(resolve include-windows-x86)" >> "$GITHUB_OUTPUT"
          echo "include-linux-x64=$(resolve include-linux-x64)" >> "$GITHUB_OUTPUT"
          echo "include-linux-x86=$(resolve include-linux-x86)" >> "$GITHUB_OUTPUT"
          echo "include-macos-x64=$(resolve include-macos-x64)" >> "$GITHUB_OUTPUT"
          echo "include-macos-aarch64=$(resolve include-macos-aarch64)" >> "$GITHUB_OUTPUT"
          echo "allow-failure=$(resolve allow-failure)" >> "$GITHUB_OUTPUT"
          echo "env=$(resolve env)" >> "$GITHUB_OUTPUT"
          echo "filter=$(resolve filter)" >> "$GITHUB_OUTPUT"
          echo "github_job_prep_script=$(resolve github_job_prep_script)" >> "$GITHUB_OUTPUT"
          echo "testitem-timeout=$(resolve testitem-timeout)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
      - uses: julia-actions/julia-compute-test-matrix@v2
        id: compute-test-matrix
        with:
          include-release-versions: ${{ steps.resolve.outputs.include-release-versions }}
          include-lts-versions: ${{ steps.resolve.outputs.include-lts-versions }}
          include-all-compatible-minor-versions: ${{ steps.resolve.outputs.include-all-compatible-minor-versions }}
          include-smallest-compatible-minor-versions: ${{ steps.resolve.outputs.include-smallest-compatible-minor-versions }}
          include-rc-versions: ${{ steps.resolve.outputs.include-rc-versions }}
          include-beta-versions: ${{ steps.resolve.outputs.include-beta-versions }}
          include-alpha-versions: ${{ steps.resolve.outputs.include-alpha-versions }}
          include-nightly-versions: ${{ steps.resolve.outputs.include-nightly-versions }}
          include-windows-x64: ${{ steps.resolve.outputs.include-windows-x64 }}
          include-windows-x86: ${{ steps.resolve.outputs.include-windows-x86 }}
          include-linux-x64: ${{ steps.resolve.outputs.include-linux-x64 }}
          include-linux-x86: ${{ steps.resolve.outputs.include-linux-x86 }}
          include-macos-x64: ${{ steps.resolve.outputs.include-macos-x64 }}
          include-macos-aarch64: ${{ steps.resolve.outputs.include-macos-aarch64 }}
          allow-failure: ${{ steps.resolve.outputs.allow-failure }}

  run-tests:
    if: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') || (github.event_name == 'workflow_dispatch' && github.event.inputs.feature == 'LintAndTest') }}
    needs: compute-test-matrix
    strategy:
        fail-fast: false
        matrix:
          include: ${{ fromJson(needs.compute-test-matrix.outputs.test-matrix) }}
    runs-on: ${{ matrix.os }}
    # Legs the matrix marked as allowed to fail report their results but do not fail
    # the run; report-results tells the two apart by which artifact they land in.
    continue-on-error: ${{ matrix.allow-failure }}
    steps:
    - uses: actions/checkout@v7
    - uses: julia-actions/install-juliaup@v3
      with:
        channel:  ${{ matrix.juliaup-channel }}
    - uses: julia-actions/cache@v3
    # `julia-buildpkg` only installs a registry from Julia 1.5 on, and Pkg before
    # that does not clone one on demand under `Pkg.build` either. A leg without a
    # usable registry resolves every dependency to "has no known versions", and
    # because the depot is cached afterwards, a registry left half-written stays
    # broken for every later run of that leg. So the registry is checked for the
    # `Registry.toml` old Pkg reads, not merely for the folder, and anything else
    # sitting in its place is replaced. A complete registry is left alone.
    - name: Install the General registry on Julia < 1.5
      shell: bash
      run: |
        julia -e '
          VERSION < v"1.5" || exit()
          general = joinpath(DEPOT_PATH[1], "registries", "General")
          isfile(joinpath(general, "Registry.toml")) && exit()
          if ispath(general)
            println("Registry at $general is unusable, replacing it")
            # git marks its object files read-only, which blocks the delete on Windows
            for (root, dirs, files) in walkdir(general), f in files
              try chmod(joinpath(root, f), 0o777) catch end
            end
            rm(general, recursive=true)
          end
          mkpath(dirname(general))
          run(`git clone --quiet --depth=1 https://github.com/JuliaRegistries/General.git $general`)
        '
    - uses: julia-actions/julia-buildpkg@v1
    - name: Run worker prep script
      if: ${{ needs.compute-test-matrix.outputs.github_job_prep_script != '' }}
      run: julia ${{ needs.compute-test-matrix.outputs.github_job_prep_script }}
      shell: bash
    # Coverage has to be decided per leg, because the instrumentation `juliati` relies on
    # needs Julia 1.11 or newer — an older leg collects nothing whatever it is asked to do.
    - name: Decide coverage for this leg
      id: cov
      shell: bash
      env:
        COVERAGE: ${{ inputs.coverage }}
        LCOV_PATH: ${{ inputs.coverage-lcov-path }}
        CHANNEL: ${{ matrix.juliaup-channel }}
      run: |
        # Setting `coverage-lcov-path` is an opt-in of its own, for a repository that wants
        # the file at a particular place (or wants it while `coverage` is off).
        want=false
        if [[ "$COVERAGE" == "true" || -n "$LCOV_PATH" ]]; then
          want=true
        fi

        # `juliaup-channel` is "<version>~<arch>" for a stable leg and "<channel>~<arch>"
        # (rc/beta/alpha/nightly) otherwise. Every named pre-release channel is newer than
        # 1.11, so only the numeric form needs comparing.
        eligible=true
        version="${CHANNEL%%~*}"
        if [[ "$version" =~ ^([0-9]+)\.([0-9]+) ]]; then
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          if (( major < 1 || (major == 1 && minor < 11) )); then
            eligible=false
          fi
        fi

        path=""
        if [[ "$want" == "true" && "$eligible" == "true" ]]; then
          path="${LCOV_PATH:-lcov.info}"
        elif [[ "$want" == "true" ]]; then
          echo "::notice::Coverage skipped on Julia $version: test item coverage requires Julia 1.11 or newer."
        fi
        echo "lcov-path=$path" >> "$GITHUB_OUTPUT"
    - name: Run tests
      uses: julia-actions/julia-run-testitems@v2
      with:
        juliaup-channel: ${{ matrix.juliaup-channel }}
        profile-name: ${{ format('Julia {0}:{1}', matrix.juliaup-channel, matrix.os) }}
        results-path: ${{ format('testitemresults-{0}-{1}.json', matrix.os, matrix.juliaup-channel) }}
        env: ${{ needs.compute-test-matrix.outputs.env }}
        filter: ${{ needs.compute-test-matrix.outputs.filter }}
        testitem-timeout: ${{ needs.compute-test-matrix.outputs.testitem-timeout }}
        junit-path: ${{ inputs.junit-path }}
        coverage-lcov-path: ${{ steps.cov.outputs.lcov-path }}
        output-mode: ${{ inputs.output-mode }}
        max-workers: ${{ inputs.max-workers }}
        threads: ${{ inputs.threads }}
        gc-between-testitems: ${{ inputs.gc-between-testitems }}
        memory-threshold: ${{ inputs.memory-threshold }}
        schedule: ${{ inputs.schedule }}
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: ${{ format('testitemresults-{0}-{1}-{2}', matrix.allow-failure && 'allowfail' || 'blocking', matrix.os, matrix.juliaup-channel) }}
        path: ${{ format('testitemresults-{0}-{1}.json', matrix.os, matrix.juliaup-channel) }}
        retention-days: 1
    # No `julia-processcoverage` here: that action collects the `.cov` files
    # `Pkg.test(coverage=true)` leaves behind, and `juliati` has none — it merges coverage
    # in-process and writes the LCOV itself. Running it anyway found no `.cov` file for any
    # source file, assumed "no coverage", and wrote an lcov.info in which every line had
    # zero hits, which Codecov faithfully reported as 0%.
    - uses: codecov/codecov-action@v7
      # An absent file means no coverage was collected — the leg was skipped, or the run
      # died before writing it. Uploading nothing at all beats uploading a false zero.
      if: ${{ !cancelled() && steps.cov.outputs.lcov-path != '' && hashFiles(steps.cov.outputs.lcov-path) != '' }}
      with:
        files: ${{ steps.cov.outputs.lcov-path }}
        # Without this the uploader goes looking for other coverage files on its own.
        disable_search: true
        fail_ci_if_error: false
        flags: unittests
        token: ${{ secrets.codecov_token }}

  report-results:
    needs: [run-tests, lint]
    if: ${{ !cancelled() && ((github.event_name == 'push' || github.event_name == 'pull_request') || (github.event_name == 'workflow_dispatch' && github.event.inputs.feature == 'LintAndTest')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: testitemresults-blocking-*
          path: testresults
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          # Failures here are reported but must not fail the run.
          pattern: testitemresults-allowfail-*
          path: allowfailresults
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          # The pattern form tolerates a skipped lint job (a bare name errors
          # when the artifact does not exist).
          pattern: lintresults*
          path: lintresults
          merge-multiple: true
      - uses: julia-actions/julia-report-ci-results@v2
        with:
          results-path: testresults
          allowed-failure-results-path: allowfailresults
          lint-results-path: lintresults
          process-logs-retention-days: 14
      - uses: geekyeggo/delete-artifact@v6
        with:
          name: |
            testitemresults-*
            lintresults
          # Duplicate artifact names (e.g. from a retried matrix job) make the
          # by-name delete 404 on the second copy; cleanup must not fail the run.
          failOnError: false

  deploy-docs:
    if: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') || (github.event_name == 'workflow_dispatch' && github.event.inputs.feature == 'DocDeploy') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check file existence
        id: check_files
        uses: andstor/file-existence-action@v3
        with:
          files: "docs/make.jl"
      - uses: julia-actions/cache@v3
        if: steps.check_files.outputs.files_exists == 'true'
      - uses: julia-actions/julia-buildpkg@v1
        if: steps.check_files.outputs.files_exists == 'true'
      - uses: julia-actions/julia-docdeploy@v1
        if: steps.check_files.outputs.files_exists == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tagbot:
    if: ${{ (github.event_name == 'issue_comment' && github.actor == 'JuliaTagBot') || (github.event_name == 'workflow_dispatch' && github.event.inputs.feature == 'TagBot') }}
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branches: true
