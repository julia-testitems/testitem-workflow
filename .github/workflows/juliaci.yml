        default: ""
      # Overrides for push to main/master runs
      main-include-release-versions:
        type: string
        required: false
        default: ""
      main-include-lts-versions:
        type: string
        required: false
        default: ""
      main-include-all-compatible-minor-versions:
        type: string
        required: false
        default: ""
      main-include-smallest-compatible-minor-versions:
        type: string
        required: false
        default: ""
      main-include-rc-versions:
        type: string
        required: false
        default: ""
      main-include-beta-versions:
        type: string
        required: false
        default: ""
      main-include-alpha-versions:
        type: string
        required: false
        default: ""
      main-include-nightly-versions:
        type: string
        required: false
        default: ""
      main-include-windows-x64:
        type: string
        required: false
        default: ""
      main-include-windows-x86:
        type: string
        required: false
        default: ""
      main-include-linux-x64:
        type: string
        required: false
        default: ""
      main-include-linux-x86:
        type: string
        required: false
        default: ""
      main-include-macos-x64:
        type: string
        required: false
        default: ""
      main-include-macos-aarch64:
        type: string
        required: false
        default: ""
      main-allow-failure:
        type: string
        required: false
        default: ""
      main-env:
        type: string
        required: false
        default: ""
      main-filter:
        type: string
        required: false
        default: ""
      main-github_job_prep_script:
        type: string
        required: false
        default: ""
      main-testitem-timeout:
        type: string
        required: false
        default: ""
      # Overrides for manual workflow_dispatch runs
      manual-trigger-include-release-versions:
        type: string
        required: false
        default: ""
      manual-trigger-include-lts-versions:
        type: string
        required: false
        default: ""
      manual-trigger-include-all-compatible-minor-versions:
        type: string
        required: false
        default: ""
      manual-trigger-include-smallest-compatible-minor-versions:
        type: string
        required: false
        default: ""
      manual-trigger-include-rc-versions:
        type: string
        required: false
        default: ""
      manual-trigger-include-beta-versions:
        type: string
        required: false
        default: ""
      manual-trigger-include-alpha-versions:
        type: string
        required: false
        default: ""
      manual-trigger-include-nightly-versions:
        type: string
        required: false
        default: ""
      manual-trigger-include-windows-x64:
        type: string
        required: false
        default: ""
      manual-trigger-include-windows-x86:
        type: string
        required: false
        default: ""
      manual-trigger-include-linux-x64:
        type: string
        required: false
        default: ""
      manual-trigger-include-linux-x86:
        type: string
        required: false
        default: ""
      manual-trigger-include-macos-x64:
        type: string
        required: false
        default: ""
      manual-trigger-include-macos-aarch64:
        type: string
        required: false
        default: ""
      manual-trigger-allow-failure:
        type: string
        required: false
        default: ""
      manual-trigger-env:
        type: string
        required: false
        default: ""
      manual-trigger-filter:
        type: string
        required: false
        default: ""
      manual-trigger-github_job_prep_script:
        type: string
        required: false
        default: ""
      manual-trigger-testitem-timeout:
        type: string
        required: false
        default: ""
    secrets:
      # Only needed when coverage is collected, which is why this is not required: a
      # repository that sets `coverage: false` should not have to invent a token.
      codecov_token:
        required: false

permissions: write-all

concurrency:
  # The trailing run id is empty on a first attempt, so fresh runs share a group and
  # cancel each other as before. A re-run gets a group of its own: it is a deliberate
  # act on one specific run, so it must neither cancel nor be cancelled by whatever
  # else is currently in flight for the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ github.run_attempt != '1' && github.run_id || '' }}
  cancel-in-progress: true

jobs:
  # Push events cover both branches and tags, and the two mean different things here: a
  # branch push is new code, a tag push is a release of a commit that already went
  # through CI on its branch. So lint/format/tests only run for branch pushes
  # (`github.ref_type == 'branch'` — in a reusable workflow the github context is the
  # caller's), while docs deployment also runs for `v*` tags to build the versioned
  # documentation. A tag that does not start with `v` currently runs nothing; callers
  # are told to trigger on every tag (`tags: ['**']`) so that future tag-driven
  # features only need changes here, not in every caller's workflow file.
  lint:
    if: ${{ ((github.event_name == 'push' && github.ref_type == 'branch') || github.event_name == 'pull_request') || (github.event_name == 'workflow_dispatch' && github.event.inputs.feature == 'LintAndTest') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/julia-lint@v2
        id: lint-step
      - uses: actions/upload-artifact@v7
        # The lint step fails the job on lint errors, but the SARIF is still
        # needed by the report job.
        if: ${{ !cancelled() }}
        with:
          name: lintresults
          path: lint-results.sarif
          # Artifact names are unique per run, not per attempt, so re-running this job
          # would otherwise conflict with the previous attempt's copy.
          overwrite: true
          # Long enough to cover GitHub's 30-day re-run window: "Re-run failed jobs"
          # does not re-run the jobs that passed, so their artifacts have to outlive
          # the first attempt for the report to stay complete.
          retention-days: 30
          # A tool failure (exit code 2) produces no SARIF file.
          if-no-files-found: ignore

  # Check-only formatting gate (the canonical CI mode: fail with a diff, fix
  # locally). Runs whenever lint/tests run; a repo opts in by having a
  # JuliaFormat.toml anywhere in its tree — without one, every step no-ops.
  format:
    if: ${{ ((github.event_name == 'push' && github.ref_type == 'branch') || github.event_name == 'pull_request') || (github.event_name == 'workflow_dispatch' && github.event.inputs.feature == 'LintAndTest') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-vscode/julia-format@v1
        with:
          # Opt-in gate: without a JuliaFormat.toml the action no-ops.
          require-config: true

  compute-test-matrix:
    if: ${{ ((github.event_name == 'push' && github.ref_type == 'branch') || github.event_name == 'pull_request') || (github.event_name == 'workflow_dispatch' && github.event.inputs.feature == 'LintAndTest') }}
    runs-on: ubuntu-latest
    outputs:
      test-matrix: ${{ steps.compute-test-matrix.outputs.test-matrix }}
      env: ${{ steps.resolve.outputs.env }}
      filter: ${{ steps.resolve.outputs.filter }}
      github_job_prep_script: ${{ steps.resolve.outputs.github_job_prep_script }}
      testitem-timeout: ${{ steps.resolve.outputs.testitem-timeout }}
    steps:
      - id: resolve
        shell: bash
        env:
          INPUTS_JSON: ${{ toJson(inputs) }}
          IS_DRAFT_PR: ${{ github.event.pull_request.draft }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$IS_DRAFT_PR" == "true" ]]; then
            prefix="draft-pr-"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            prefix="pr-"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            prefix="main-"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            prefix="manual-trigger-"
          else
            prefix=""
          fi

          resolve() {
            local key="$1"
            local override
            override=$(echo "$INPUTS_JSON" | jq -r --arg k "${prefix}${key}" '.[$k] // ""')
            if [[ -n "$override" ]]; then
              echo "$override"
            else
              echo "$INPUTS_JSON" | jq -r --arg k "$key" '.[$k] | tostring'
            fi
          }

          echo "include-release-versions=$(resolve include-release-versions)" >> "$GITHUB_OUTPUT"
          echo "include-lts-versions=$(resolve include-lts-versions)" >> "$GITHUB_OUTPUT"
          echo "include-all-compatible-minor-versions=$(resolve include-all-compatible-minor-versions)" >> "$GITHUB_OUTPUT"
          echo "include-smallest-compatible-minor-versions=$(resolve include-smallest-compatible-minor-versions)" >> "$GITHUB_OUTPUT"
          echo "include-rc-versions=$(resolve include-rc-versions)" >> "$GITHUB_OUTPUT"
          echo "include-beta-versions=$(resolve include-beta-versions)" >> "$GITHUB_OUTPUT"
          echo "include-alpha-versions=$(resolve include-alpha-versions)" >> "$GITHUB_OUTPUT"
          echo "include-nightly-versions=$(resolve include-nightly-versions)" >> "$GITHUB_OUTPUT"
          echo "include-windows-x64=$(resolve include-windows-x64)" >> "$GITHUB_OUTPUT"
          echo "include-windows-x86=$(resolve include-windows-x86)" >> "$GITHUB_OUTPUT"
          echo "include-linux-x64=$(resolve include-linux-x64)" >> "$GITHUB_OUTPUT"
          echo "include-linux-x86=$(resolve include-linux-x86)" >> "$GITHUB_OUTPUT"
          echo "include-macos-x64=$(resolve include-macos-x64)" >> "$GITHUB_OUTPUT"
          echo "include-macos-aarch64=$(resolve include-macos-aarch64)" >> "$GITHUB_OUTPUT"
          echo "allow-failure=$(resolve allow-failure)" >> "$GITHUB_OUTPUT"
          echo "env=$(resolve env)" >> "$GITHUB_OUTPUT"
          echo "filter=$(resolve filter)" >> "$GITHUB_OUTPUT"
          echo "github_job_prep_script=$(resolve github_job_prep_script)" >> "$GITHUB_OUTPUT"
          echo "testitem-timeout=$(resolve testitem-timeout)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
      - uses: julia-actions/julia-compute-test-matrix@v2
        id: compute-test-matrix
        with:
          include-release-versions: ${{ steps.resolve.outputs.include-release-versions }}
          include-lts-versions: ${{ steps.resolve.outputs.include-lts-versions }}
          include-all-compatible-minor-versions: ${{ steps.resolve.outputs.include-all-compatible-minor-versions }}
          include-smallest-compatible-minor-versions: ${{ steps.resolve.outputs.include-smallest-compatible-minor-versions }}
          include-rc-versions: ${{ steps.resolve.outputs.include-rc-versions }}
          include-beta-versions: ${{ steps.resolve.outputs.include-beta-versions }}
          include-alpha-versions: ${{ steps.resolve.outputs.include-alpha-versions }}
          include-nightly-versions: ${{ steps.resolve.outputs.include-nightly-versions }}
          include-windows-x64: ${{ steps.resolve.outputs.include-windows-x64 }}
          include-windows-x86: ${{ steps.resolve.outputs.include-windows-x86 }}
          include-linux-x64: ${{ steps.resolve.outputs.include-linux-x64 }}
          include-linux-x86: ${{ steps.resolve.outputs.include-linux-x86 }}
          include-macos-x64: ${{ steps.resolve.outputs.include-macos-x64 }}
          include-macos-aarch64: ${{ steps.resolve.outputs.include-macos-aarch64 }}
          allow-failure: ${{ steps.resolve.outputs.allow-failure }}

  run-tests:
    if: ${{ ((github.event_name == 'push' && github.ref_type == 'branch') || github.event_name == 'pull_request') || (github.event_name == 'workflow_dispatch' && github.event.inputs.feature == 'LintAndTest') }}
    needs: compute-test-matrix
    strategy:
        fail-fast: false
        matrix:
          include: ${{ fromJson(needs.compute-test-matrix.outputs.test-matrix) }}
    runs-on: ${{ matrix.os }}
    # Legs the matrix marked as allowed to fail report their results but do not fail
    # the run; report-results tells the two apart by which artifact they land in.
    continue-on-error: ${{ matrix.allow-failure }}
    steps:
    - uses: actions/checkout@v7
    - uses: julia-actions/install-juliaup@v3
      with:
        channel:  ${{ matrix.juliaup-channel }}
    - uses: julia-actions/cache@v3
    # `julia-buildpkg` only installs a registry from Julia 1.5 on, and Pkg before
    # that does not clone one on demand under `Pkg.build` either. A leg without a
    # usable registry resolves every dependency to "has no known versions", and
    # because the depot is cached afterwards, a registry left half-written stays
    # broken for every later run of that leg. So the registry is checked for the
    # `Registry.toml` old Pkg reads, not merely for the folder, and anything else
    # sitting in its place is replaced. A complete registry is left alone.
    - name: Install the General registry on Julia < 1.5
      shell: bash
      run: |
        julia -e '
          VERSION < v"1.5" || exit()
          general = joinpath(DEPOT_PATH[1], "registries", "General")
          isfile(joinpath(general, "Registry.toml")) && exit()
          if ispath(general)
            println("Registry at $general is unusable, replacing it")
            # git marks its object files read-only, which blocks the delete on Windows
            for (root, dirs, files) in walkdir(general), f in files
              try chmod(joinpath(root, f), 0o777) catch end
            end
            rm(general, recursive=true)
          end
          mkpath(dirname(general))
          run(`git clone --quiet --depth=1 https://github.com/JuliaRegistries/General.git $general`)
        '
    - uses: julia-actions/julia-buildpkg@v1
    - name: Run worker prep script
      if: ${{ needs.compute-test-matrix.outputs.github_job_prep_script != '' }}
      run: julia ${{ needs.compute-test-matrix.outputs.github_job_prep_script }}
      shell: bash
    # Coverage has to be decided per leg, because the instrumentation `juliati` relies on
    # needs Julia 1.11 or newer — an older leg collects nothing whatever it is asked to do.
    - name: Decide coverage for this leg
      id: cov
      shell: bash
      env:
        COVERAGE: ${{ inputs.coverage }}
        LCOV_PATH: ${{ inputs.coverage-lcov-path }}
        CHANNEL: ${{ matrix.juliaup-channel }}
      run: |
        # Setting `coverage-lcov-path` is an opt-in of its own, for a repository that wants
        # the file at a particular place (or wants it while `coverage` is off).
        want=false
        if [[ "$COVERAGE" == "true" || -n "$LCOV_PATH" ]]; then
          want=true
        fi

        # `juliaup-channel` is "<version>~<arch>" for a stable leg and "<channel>~<arch>"
        # (rc/beta/alpha/nightly) otherwise. Every named pre-release channel is newer than
        # 1.11, so only the numeric form needs comparing.
        eligible=true
        version="${CHANNEL%%~*}"
        if [[ "$version" =~ ^([0-9]+)\.([0-9]+) ]]; then
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          if (( major < 1 || (major == 1 && minor < 11) )); then
            eligible=false
          fi
        fi

        path=""
        if [[ "$want" == "true" && "$eligible" == "true" ]]; then
          path="${LCOV_PATH:-lcov.info}"
        elif [[ "$want" == "true" ]]; then
          echo "::notice::Coverage skipped on Julia $version: test item coverage requires Julia 1.11 or newer."
        fi
        echo "lcov-path=$path" >> "$GITHUB_OUTPUT"
    - name: Run tests
      uses: julia-actions/julia-run-testitems@v2
      with:
        juliaup-channel: ${{ matrix.juliaup-channel }}
        profile-name: ${{ format('Julia {0}:{1}', matrix.juliaup-channel, matrix.os) }}
        results-path: ${{ format('testitemresults-{0}-{1}.json', matrix.os, matrix.juliaup-channel) }}
        env: ${{ needs.compute-test-matrix.outputs.env }}
        filter: ${{ needs.compute-test-matrix.outputs.filter }}
        testitem-timeout: ${{ needs.compute-test-matrix.outputs.testitem-timeout }}
        junit-path: ${{ inputs.junit-path }}
        coverage-lcov-path: ${{ steps.cov.outputs.lcov-path }}
        output-mode: ${{ inputs.output-mode }}
        max-workers: ${{ inputs.max-workers }}
        threads: ${{ inputs.threads }}
        gc-between-testitems: ${{ inputs.gc-between-testitems }}
        memory-threshold: ${{ inputs.memory-threshold }}
        schedule: ${{ inputs.schedule }}
        test-log-level: ${{ inputs.test-log-level }}
        activation-timeout: ${{ inputs.activation-timeout }}
        run-stall: ${{ inputs.run-stall }}
        check-bounds: ${{ inputs.check-bounds }}
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: ${{ format('testitemresults-{0}-{1}-{2}', matrix.allow-failure && 'allowfail' || 'blocking', matrix.os, matrix.juliaup-channel) }}
        path: ${{ format('testitemresults-{0}-{1}.json', matrix.os, matrix.juliaup-channel) }}
        # A re-run of this leg replaces its own result rather than colliding with the
        # previous attempt's; legs that are not re-run keep theirs untouched. This is
        # what makes exactly one artifact exist per leg per run, so the report job's
        # `merge-multiple` download cannot pick up a stale copy.
        overwrite: true
        # See the lint upload: the results of legs that a partial re-run skips have to
        # still be there for the report job to find.
        retention-days: 30
    # No `julia-processcoverage` here: that action collects the `.cov` files
    # `Pkg.test(coverage=true)` leaves behind, and `juliati` has none — it merges coverage
    # in-process and writes the LCOV itself. Running it anyway found no `.cov` file for any
    # source file, assumed "no coverage", and wrote an lcov.info in which every line had
    # zero hits, which Codecov faithfully reported as 0%.
    - uses: codecov/codecov-action@v7
      # An absent file means no coverage was collected — the leg was skipped, or the run
      # died before writing it. Uploading nothing at all beats uploading a false zero.
      if: ${{ !cancelled() && steps.cov.outputs.lcov-path != '' && hashFiles(steps.cov.outputs.lcov-path) != '' }}
      with:
        files: ${{ steps.cov.outputs.lcov-path }}
        # Without this the uploader goes looking for other coverage files on its own.
        disable_search: true
        fail_ci_if_error: false
        flags: unittests
        token: ${{ secrets.codecov_token }}

  report-results:
    # `compute-test-matrix` is already an ancestor via `run-tests`; naming it here adds
    # no ordering, only access to its `test-matrix` output.
    needs: [run-tests, lint, compute-test-matrix]
    if: ${{ !cancelled() && (((github.event_name == 'push' && github.ref_type == 'branch') || github.event_name == 'pull_request') || (github.event_name == 'workflow_dispatch' && github.event.inputs.feature == 'LintAndTest')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: testitemresults-blocking-*
          path: testresults
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          # Failures here are reported but must not fail the run.
          pattern: testitemresults-allowfail-*
          path: allowfailresults
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          # The pattern form tolerates a skipped lint job (a bare name errors
          # when the artifact does not exist).
          pattern: lintresults*
          path: lintresults
          merge-multiple: true
      # Which legs the report should have heard from. The profile-name format lives
      # here, next to the `profile-name` the run-tests job hands each leg, rather than
      # being duplicated in the report action.
      - name: Derive the expected profile names
        id: expected-profiles
        shell: bash
        env:
          TEST_MATRIX: ${{ needs.compute-test-matrix.outputs.test-matrix }}
        run: |
          # `report-results` runs even when the matrix job failed, in which case there is
          # no matrix to check against — leave the list empty rather than failing here
          # with a jq parse error on top of the real failure.
          if [ -z "$TEST_MATRIX" ]; then
            profiles='[]'
          else
            profiles=$(echo "$TEST_MATRIX" | jq -c '[.[] | {name: "Julia \(.["juliaup-channel"]):\(.os)", allowFailure: (.["allow-failure"] == true)}]')
          fi
          echo "profiles=$profiles" >> "$GITHUB_OUTPUT"
      - uses: julia-actions/julia-report-ci-results@v2
        with:
          results-path: testresults
          allowed-failure-results-path: allowfailresults
          lint-results-path: lintresults
          process-logs-retention-days: 14
          # Without this the report has no idea how many legs it should have seen, so a
          # leg whose artifact never arrived is silently left out of an otherwise green
          # summary instead of being called out.
          expected-profiles: ${{ steps.expected-profiles.outputs.profiles }}
      # There is deliberately no artifact cleanup step here. Deleting the results at the
      # end of the run is what broke "Re-run failed jobs": a partial re-run re-runs only
      # the failed legs, so the results of every other leg have to survive the first
      # attempt. `retention-days` on the uploads is the only expiry.

  deploy-docs:
    # Unlike the test jobs, this one also runs for `v*` tag pushes: that is how
    # Documenter builds the versioned docs for a release tag pushed by hand.
    # (Expressions have no glob matching; `startsWith` is the `v*` equivalent.)
    # Tags created by TagBot never reach this trigger — see deploy-tagged-docs.
    if: ${{ (github.event_name == 'push' && (github.ref_type == 'branch' || startsWith(github.ref_name, 'v'))) || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.feature == 'DocDeploy') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check file existence
        id: check_files
        uses: andstor/file-existence-action@v3
        with:
          files: "docs/make.jl"
      - uses: julia-actions/cache@v3
        if: steps.check_files.outputs.files_exists == 'true'
      - uses: julia-actions/julia-buildpkg@v1
        if: steps.check_files.outputs.files_exists == 'true'
      - uses: julia-actions/julia-docdeploy@v1
        if: steps.check_files.outputs.files_exists == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tagbot:
    if: ${{ (github.event_name == 'issue_comment' && github.actor == 'JuliaTagBot') || (github.event_name == 'workflow_dispatch' && github.event.inputs.feature == 'TagBot') }}
    runs-on: ubuntu-latest
    outputs:
      new-tags: ${{ steps.diff-tags.outputs.new-tags }}
    steps:
      # The tag list is snapshotted around the TagBot step so deploy-tagged-docs knows
      # exactly which tags this run created — TagBot itself does not report them.
      - name: Record the tags that exist before TagBot runs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --paginate "repos/${GITHUB_REPOSITORY}/tags" --jq '.[].name' | sort > "${RUNNER_TEMP}/tags-before"
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branches: true
      - name: Find the tags TagBot created
        id: diff-tags
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/tags" --jq '.[].name' | sort > "${RUNNER_TEMP}/tags-after"
          # Only `v*` tags, matching the deploy-docs tag policy; TagBot only creates
          # `v<version>` tags anyway. `[]` when TagBot created nothing (for example a
          # trigger comment for an already-tagged version).
          new_tags=$(comm -13 "${RUNNER_TEMP}/tags-before" "${RUNNER_TEMP}/tags-after" | jq --compact-output --raw-input --null-input '[inputs | select(startswith("v"))]')
          echo "New tags: $new_tags"
          echo "new-tags=$new_tags" >> "$GITHUB_OUTPUT"

  # Deploys the versioned documentation for the tags TagBot just created. TagBot
  # authenticates with the run's GITHUB_TOKEN, and events created with that token do
  # not trigger workflows (GitHub suppresses cascading runs), so the caller's `tags:`
  # push trigger never fires for a TagBot tag and the release's docs would silently
  # never be built. The classic fix is giving TagBot an SSH deploy key
  # (DOCUMENTER_KEY), which every repository would have to generate and configure;
  # riding the run that created the tag needs no per-repository secret at all.
  deploy-tagged-docs:
    needs: tagbot
    if: ${{ needs.tagbot.outputs.new-tags != '' && needs.tagbot.outputs.new-tags != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJson(needs.tagbot.outputs.new-tags) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ matrix.tag }}
      - name: Check file existence
        id: check_files
        uses: andstor/file-existence-action@v3
        with:
          files: "docs/make.jl"
      - uses: julia-actions/cache@v3
        if: steps.check_files.outputs.files_exists == 'true'
      - uses: julia-actions/julia-buildpkg@v1
        if: steps.check_files.outputs.files_exists == 'true'
      - uses: julia-actions/julia-docdeploy@v1
        if: steps.check_files.outputs.files_exists == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Documenter decides what kind of build this is from these environment
          # variables, and the run's real values describe the TagBot trigger (an
          # issue_comment on the default branch), for which deploydocs deploys
          # nothing. The override makes deploydocs see exactly what it would have
          # seen had the tag push triggered its own run — a push build of the tag —
          # so it deploys the versioned docs folder. Pushing to gh-pages with
          # GITHUB_TOKEN is unaffected by the token's restrictions, which block
          # triggering further workflows and modifying .github/workflows files,
          # neither of which happens here.
          GITHUB_REF: refs/tags/${{ matrix.tag }}
          GITHUB_EVENT_NAME: push
